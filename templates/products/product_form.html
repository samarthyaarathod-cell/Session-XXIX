{% extends "base.html" %}
{% block title %}{{ title }} | MusicZone{% endblock %}
{% block content %}
  <h1>{{ title }}</h1>
  <form method="post">
    {% csrf_token %}{{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}{{ field.errors }}
    {% endfor %}
    <button type="submit">Save product</button>
    <a href="{% url 'product_list' %}">Cancel</a>
  </form>
{% endblock %}
