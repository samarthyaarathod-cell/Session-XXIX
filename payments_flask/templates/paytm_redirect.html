{% extends "base.html" %}
{% block title %}Continue to Paytm{% endblock %}
{% block content %}
  <h1>Continue to Paytm sandbox</h1>
  <p>Redirecting to Paytm’s hosted test checkout…</p>
  <form id="paytm-checkout" method="post" action="{{ action }}">
    <input type="hidden" name="mid" value="{{ mid }}">
    <input type="hidden" name="orderId" value="{{ order_id }}">
    <input type="hidden" name="txnToken" value="{{ txn_token }}">
    <noscript><button type="submit">Continue to payment</button></noscript>
  </form>
  <script>document.getElementById("paytm-checkout").submit();</script>
{% endblock %}
