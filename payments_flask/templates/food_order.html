{% extends "base.html" %}
{% block title %}Stripe food order{% endblock %}
{% block content %}
  <h1>Place a food order</h1>
  <p>Stripe Checkout runs in test mode when you provide an <code>sk_test_...</code> key.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="name">Name</label><input id="name" name="name" autocomplete="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required>
    <label for="item">Dish name</label><input id="item" name="item" value="Veggie bowl" required>
    <label for="amount">Price (USD)</label><input id="amount" name="amount" type="number" min="0.50" max="100000" step="0.01" value="12.50" required>
    <button type="submit">Pay now with Stripe</button>
  </form>
{% endblock %}
